name: Deploy functions

# Deploys the Supabase Edge Functions to whichever project belongs to the branch
# the change arrived on, exactly as "Deploy database" does. Nothing runs from a
# laptop.
#
#   main      → production  (the basic app)
#   advanced  → staging     (CostMatrix Staging, in the second Supabase account)
#
# Two separate jobs, each guarded by the branch, rather than one job that picks
# its secrets: a run on main cannot reach the staging project and a run on
# advanced cannot reach production, whatever anyone later adds to the file.
#
# Production needs the same three secrets as the database workflow:
#   SUPABASE_ACCESS_TOKEN   a personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    the bit of the project URL before .supabase.co
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was made
#
# Staging needs the staging secrets and variable from
# docs/reference/two-track-setup.md:
#   SUPABASE_STAGING_ACCESS_TOKEN  (secret) the second account's token — the only
#                                  token the staging job uses
#   SUPABASE_STAGING_DB_PASSWORD   (secret)
#   SUPABASE_STAGING_PROJECT_REF   (variable) from the "Create staging project" run

on:
  push:
    branches: [main, advanced]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  # Unchanged from before the two tracks, character for character, but for the
  # one `if:` line below. The live path is not the place for tidying up.
  deploy:
    name: Deploy the Edge Functions
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

  staging:
    name: Deploy the Edge Functions to staging
    if: github.ref_name == 'advanced'
    runs-on: ubuntu-latest
    env:
      # Staging lives in a second Supabase account (D-182), so this job uses that
      # account's token. The Supabase CLI only reads SUPABASE_ACCESS_TOKEN, so the
      # staging secret is mapped onto that name; the production token is not in
      # this job's environment at all.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the staging project is known
        run: |
          if [ -z "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" ]; then
            echo "::error::The repository variable SUPABASE_STAGING_PROJECT_REF is not set."
            echo "Run the \"Create staging project\" workflow; its summary tells you the value to add."
            echo "See docs/reference/two-track-setup.md."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}" ]; then
            echo "::error::The repository secret SUPABASE_STAGING_ACCESS_TOKEN is not set."
            echo "Staging is a second Supabase account; this is its access token."
            echo "See docs/reference/two-track-setup.md."
            exit 1
          fi
          if [ "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" = "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::SUPABASE_STAGING_PROJECT_REF is the production project. Refusing to deploy."
            exit 1
          fi
          echo "Staging project is set, and is not production."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF }}"

      - name: Deploy every function
        run: supabase functions deploy
