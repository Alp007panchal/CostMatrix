name: Deploy functions

# Deploys the Supabase Edge Functions when they reach main. Same three secrets
# as the database workflow; nothing runs from a laptop.
#
#   SUPABASE_ACCESS_TOKEN   a personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    the bit of the project URL before .supabase.co
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was made

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy the Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy
