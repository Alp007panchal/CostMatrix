name: Create staging project

# Builds the "CostMatrix Staging" Supabase project that the advanced track runs
# against, so that nothing on the advanced branch can reach production data.
#
# You run this by hand, from the Actions tab, and you can run it again whenever
# you like: it reuses the project if it already exists, wakes it if Supabase has
# paused it (free projects pause after about a week of no use), and applies any
# migrations that are new since last time.
#
# Needs these repository secrets — docs/reference/two-track-setup.md has the
# click-by-click steps:
#   SUPABASE_ACCESS_TOKEN         (already there; used by the other workflows too)
#   SUPABASE_PROJECT_REF          (already there; read only to find the right
#                                  Supabase organisation and region, and to make
#                                  sure staging is never the production project)
#   SUPABASE_STAGING_DB_PASSWORD  (new)
#
# At the end it prints everything you need to finish in Vercel, and it never
# prints the secret key or any password.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Your email address — becomes the master administrator on staging'
        required: true
        type: string
      admin_name:
        description: 'Your name, as the app should show it'
        required: false
        type: string
        default: 'Master Administrator'
      company_name:
        description: 'The in-house company to create on staging'
        required: false
        type: string
        default: 'Staging Company'
      seed_library:
        description: 'Load data/seed into the staging library (735 parts, 296 kits)'
        required: false
        type: boolean
        default: true
      existing_project_ref:
        description: 'Use this existing project instead — leave blank to create one. Only needed if Supabase refuses a new free project.'
        required: false
        type: string
        default: ''

# One at a time: two runs creating the same project would race each other.
concurrency:
  group: create-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Create or refresh CostMatrix Staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - name: Check the secrets are present
        run: |
          missing=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]        && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]         && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}" ] && missing="$missing SUPABASE_STAGING_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See docs/reference/two-track-setup.md."
            exit 1
          fi
          echo "All three secrets are set."

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # bootstrap.sql and the seed are applied with psql, not the CLI.
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Find it, wake it, or create it — and refuse to go on if the ref it
      # resolved to is the production project.
      - name: Find, wake, adopt or create the project
        id: project
        run: ./scripts/staging/resolve-project.sh
        env:
          ADOPT_PROJECT_REF: ${{ inputs.existing_project_ref }}

      - name: Link the project
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Show what will be applied
        run: supabase migration list --linked || true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Confirm what was applied
        run: supabase migration list --linked
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      # The staging app cannot invite anybody without these.
      - name: Deploy the Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Create the first login, and load the library
        id: bootstrap
        run: ./scripts/staging/bootstrap-staging.sh
        env:
          STAGING_REF: ${{ steps.project.outputs.ref }}
          STAGING_REGION: ${{ steps.project.outputs.region }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_NAME: ${{ inputs.admin_name }}
          COMPANY_NAME: ${{ inputs.company_name }}
          SEED_LIBRARY: ${{ inputs.seed_library }}

      - name: Point invitation links at the preview
        run: supabase secrets set "SITE_URL=${{ vars.ADVANCED_PREVIEW_URL }}"
        if: ${{ vars.ADVANCED_PREVIEW_URL != '' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: What to do next
        run: |
          {
            echo "## CostMatrix Staging is ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Project ref | \`${{ steps.project.outputs.ref }}\` |"
            echo "| Project URL | ${{ steps.project.outputs.url }} |"
            echo "| Dashboard | https://supabase.com/dashboard/project/${{ steps.project.outputs.ref }} |"
            echo "| Master administrator | ${{ inputs.admin_email }} |"
            echo ""
            echo "### 1. Add one repository variable"
            echo ""
            echo "Settings → Secrets and variables → Actions → **Variables** tab → New repository variable:"
            echo ""
            echo "| Name | Value |"
            echo "|---|---|"
            echo "| \`SUPABASE_STAGING_PROJECT_REF\` | \`${{ steps.project.outputs.ref }}\` |"
            echo ""
            echo "Until this is set, pushing a migration to \`advanced\` cannot reach staging."
            echo ""
            echo "### 2. Add two Vercel environment variables"
            echo ""
            echo "Vercel → CostMatrix → Settings → Environment Variables. Add each one with the"
            echo "**Preview** environment ticked and the branch set to \`advanced\`:"
            echo ""
            echo "| Name | Value |"
            echo "|---|---|"
            echo "| \`VITE_SUPABASE_URL\` | \`${{ steps.project.outputs.url }}\` |"
            echo "| \`VITE_SUPABASE_PUBLISHABLE_KEY\` | \`${{ steps.bootstrap.outputs.anon_key }}\` |"
            echo ""
            echo "These two are public values — they are the ones the browser uses. The secret key"
            echo "and the database password are not printed here and are not needed."
            echo ""
            echo "### 3. Set your staging password"
            echo ""
            echo "Open the \`advanced\` preview URL, click **Forgot password**, and use"
            echo "${{ inputs.admin_email }}. Your staging password is separate from your"
            echo "production one, and nobody — including me — knows it."
          } >> "$GITHUB_STEP_SUMMARY"
