name: Uptime check

# Asks, four times a day, whether the two things the app is made of are
# answering: the site Vercel serves, and the Supabase project behind it. A
# failure is a red tick and an email from GitHub, which is the whole point —
# nobody watches a dashboard.
#
# **Why four times a day and not every five minutes.** GitHub bills Actions by
# the minute on a private repository and rounds every run up to one, so a
# five-minute check would spend about 8,600 minutes a month against a 2,000
# minute allowance. Four times a day costs about 120. If you want to be told
# within minutes rather than within hours, the honest answer is not this file:
# it is a free uptime service (UptimeRobot and Better Stack both do 5-minute
# checks on a free plan, and email or text you). docs/operations.md says how,
# and this job stays as the floor that needs no account and cannot lapse.
#
# It uses no secrets. Both addresses below are public: the site is public, and
# the auth health endpoint answers without a key by design.

on:
  schedule:
    # 06:00, 12:00, 18:00 and 00:00 UTC — 09:00, 15:00, 21:00, 03:00 in Nairobi,
    # so two of the four land inside the working day.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

env:
  APP_URL: https://cost-matrix-theta.vercel.app
  SUPABASE_HEALTH: https://mssqjuzgycfpfmtjukvq.supabase.co/auth/v1/health

jobs:
  check:
    name: Is the app answering
    runs-on: ubuntu-latest
    steps:
      # One retry, twenty seconds apart, before calling anything down. A single
      # blip during a Vercel deploy is not an outage, and a check that cries
      # wolf gets ignored — which is worse than not having one.
      - name: Check the app and the database
        run: |
          set -uo pipefail

          probe() {                       # name url expected-in-body
            local name="$1" url="$2" needle="$3" attempt body code start ms
            for attempt in 1 2; do
              start=$(date +%s%3N)
              body="$(curl -sS --max-time 20 -w '\n%{http_code}' "$url" 2>&1)" || body=$'\n000'
              ms=$(( $(date +%s%3N) - start ))
              code="$(printf '%s' "$body" | tail -n 1)"
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$needle"; then
                echo "| $name | up | $code | ${ms} ms |" >> summary.md
                echo "$name: 200 in ${ms} ms"
                return 0
              fi
              echo "$name: attempt $attempt gave '$code' after ${ms} ms"
              [ "$attempt" = 1 ] && sleep 20
            done
            echo "| $name | **DOWN** | $code | ${ms} ms |" >> summary.md
            echo "::error::$name did not answer properly. Last status: $code."
            return 1
          }

          : > summary.md
          failed=0
          # The site has to serve the app, not just any 200 — a misconfigured
          # host will happily return a cheerful error page.
          probe "The app ($APP_URL)" "$APP_URL" '<div id="root"' || failed=1
          # Supabase's own liveness endpoint. If this is down, signing in and
          # every screen behind it are down, whatever Vercel says.
          probe "Supabase (auth health)" "$SUPABASE_HEALTH" '"date"' || failed=1

          {
            echo "### Uptime check — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo '| What | State | Status | Time |'
            echo '|---|---|---|---|'
            cat summary.md
            echo
            if [ "$failed" = 0 ]; then
              echo 'Both answering.'
            else
              echo '**Something is down.** docs/operations.md Part D — *The site is down* —'
              echo 'says what to look at, in order. Checked twice, twenty seconds apart, so'
              echo 'this is not a single blip.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
