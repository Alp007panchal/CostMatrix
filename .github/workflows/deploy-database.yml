name: Deploy database

# Applies new migrations to whichever Supabase project belongs to the branch the
# change arrived on. Nobody runs migrations from a laptop, and no secret has to be
# shared: GitHub holds them write-only.
#
#   main      → production  (cost-matrix-theta.vercel.app). The basic app.
#   advanced  → staging     (CostMatrix Staging). Foundations and AI work.
#
# The two are separate jobs, each guarded by the branch, rather than one job that
# picks its secrets: that way a run on main cannot reach the staging project and a
# run on advanced cannot reach production, whatever anyone later adds to the file.
#
# Production needs three repository secrets (docs/operations.md Part B5):
#   SUPABASE_ACCESS_TOKEN   a personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    the bit of the project URL before .supabase.co
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was made
#
# Staging needs one more secret and one variable, both created by the
# "Create staging project" workflow and listed in docs/reference/two-track-setup.md:
#   SUPABASE_STAGING_DB_PASSWORD  (secret)
#   SUPABASE_STAGING_PROJECT_REF  (variable)

on:
  push:
    branches: [main, advanced]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  production:
    name: Apply migrations to production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply migrations
        run: supabase db push

  staging:
    name: Apply migrations to staging
    if: github.ref_name == 'advanced'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the staging project is known
        run: |
          if [ -z "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" ]; then
            echo "::error::The repository variable SUPABASE_STAGING_PROJECT_REF is not set."
            echo "Run the \"Create staging project\" workflow; its summary tells you the value to add."
            echo "See docs/reference/two-track-setup.md."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}" ]; then
            echo "::error::The repository secret SUPABASE_STAGING_DB_PASSWORD is not set."
            echo "See docs/reference/two-track-setup.md."
            exit 1
          fi
          if [ "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" = "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::SUPABASE_STAGING_PROJECT_REF is the production project. Refusing to apply."
            exit 1
          fi
          echo "Staging project is set, and is not production."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF }}"

      - name: Apply migrations
        run: supabase db push
