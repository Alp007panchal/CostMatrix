name: Deploy database

# Applies new migrations to the production Supabase project when they reach
# main. Nobody runs migrations from a laptop, and no secret has to be shared:
# GitHub holds them write-only.
#
# Needs three repository secrets, set up in docs/operations.md Part B5:
#   SUPABASE_ACCESS_TOKEN   a personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    the bit of the project URL before .supabase.co
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was made

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
