name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  database:
    name: Migrations and isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client

      - name: Apply migrations and run the tests
        run: ./supabase/tests/run-local.sh
