name: CI

on:
  push:
    branches: [main, advanced, 'claude/**']
  pull_request:

jobs:
  # More than one session works on this repository at once, and three times in
  # one week two of them took the same number: migration 0116 twice, and two
  # sets of decision numbers. A duplicate migration number is the dangerous one
  # — Supabase skips it silently, so the tables it creates never exist. This job
  # refuses the clash instead of trusting everyone to remember the rule.
  # fetch-depth: 0 so the other branches are here to compare against.
  numbering:
    name: Migration and decision numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-numbering.sh

  database:
    name: Migrations and isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - name: Apply migrations and run the tests
        run: ./supabase/tests/run-local.sh
      # The suite above applies every migration to an EMPTY database. This one
      # applies the advanced migrations to a database that is already at 0017
      # and already full of rows, which is what the merge to `main` does to
      # production, and refuses any figure that moves.
      - name: Rehearse the upgrade on a database that already holds rows
        run: ./supabase/tests/upgrade-rehearsal.sh
      # "A backup you have never restored is not a backup." This proves the
      # mechanism — that a dump of this schema restores into an empty database
      # and gives back the same costings. The drill against the owner's real
      # dump is theirs to run, and Part E of the runbook says how.
      - name: Rehearse restoring a backup
        run: ./supabase/tests/restore-drill.sh

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders. The real values come from Vercel; these
          # only need to exist so the bundle can be produced.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
