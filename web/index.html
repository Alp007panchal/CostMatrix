<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CostMatrix</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9;
        color: #1b1f24;
      }
      main { max-width: 30rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.75rem; letter-spacing: -.01em; }
      p { margin: .5rem 0; color: #56606a; }
      .tag {
        display: inline-block; margin-bottom: 1.25rem; padding: .2rem .6rem;
        border: 1px solid #ccd2d9; border-radius: 999px;
        font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #56606a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14171a; color: #e8eaed; }
        p { color: #9aa4ae; }
        .tag { border-color: #333a42; color: #9aa4ae; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Setting up</span>
      <h1>CostMatrix</h1>
      <p>Costing and quotation for electrical panel boards.</p>
      <p>
        This placeholder confirms that the repository is connected to hosting.
        The application replaces it in the first build slice.
      </p>
    </main>
  </body>
</html>
